title: "Yar Luchkin, product designer"
description: "Product designer in Belgrade. Marketplaces, travel products and the design systems behind them."
url: "https://ceoofdesign.github.io"
baseurl: "/folio"
markdown: kramdown
timezone: Europe/Belgrade

collections:
  work:
    output: true
    permalink: /work/:name/
  work_ja:
    output: true
    permalink: /ja/work/:name/

defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: ""
      type: work
    values:
      layout: case
      lang: en
  - scope:
      path: ""
      type: work_ja
    values:
      layout: case
      lang: ja
  - scope:
      path: "ja"
    values:
      lang: ja

exclude:
  - README.md
  - .gitignore
  - tools

# Показывать переключатель языка. Поставьте false, пока японские тексты не вычитаны.
ja_published: true

# Адрес веб-приложения Google Apps Script для общей таблицы рекордов игры (см. tools/leaderboard.gs и README).
# Пока пусто, рекорды сохраняются только в браузере игрока.
leaderboard_url: ""
